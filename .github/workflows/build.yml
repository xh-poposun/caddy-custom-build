name: Build and security checks

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - ".github/dependabot.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Validate version manifest
        run: |
          test -f versions.env
          ! grep -Eq 'REPLACE_WITH|=latest' versions.env

      - name: Build Caddy
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Scan binary for known Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" -mode=binary ./dist/caddy

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v') == false
        uses: actions/upload-artifact@v7
        with:
          name: caddy-linux-amd64
          path: |
            dist/caddy
            dist/modules.txt
            dist/SHA256SUMS
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/caddy
            dist/modules.txt
            dist/SHA256SUMS
            dist/build-info.txt
